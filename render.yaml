databases:
  - name: carenear-db
    plan: free
    databaseName: carenear
    user: carenear

services:
  - type: web
    name: carenear
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carenear-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
